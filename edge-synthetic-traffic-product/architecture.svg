<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f7f7f9" rx="16"/>

  <!-- Title -->
  <text x="400" y="50" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="28" font-weight="800" text-anchor="middle" fill="#222">EdgeSynth Architecture</text>
  <text x="400" y="80" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#666">Single Standalone Binary • Native Execution • High-Performance Analytics</text>

  <!-- Control Plane Container -->
  <rect x="250" y="120" width="300" height="280" fill="#fff" rx="24" stroke="#e5e7eb" stroke-width="2" filter="url(#drop-shadow)"/>
  <text x="400" y="160" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#222">EdgeSynth Binary</text>

  <!-- Internal Runner -->
  <rect x="290" y="190" width="220" height="60" fill="#fff5f6" rx="12" stroke="#ffe4e6" stroke-width="2"/>
  <text x="400" y="215" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#e11d48">Internal Task Runner</text>
  <text x="400" y="235" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#f43f5e">(Goroutines per Active Task)</text>

  <!-- Embedded UI -->
  <rect x="290" y="270" width="220" height="45" fill="#f0f9ff" rx="12" stroke="#e0f2fe" stroke-width="2"/>
  <text x="400" y="298" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#0369a1">Embedded React UI</text>

  <!-- Go API Server -->
  <rect x="290" y="335" width="220" height="45" fill="#f8fafc" rx="12" stroke="#e0f2fe" stroke-width="2"/>
  <text x="400" y="363" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#0369a1">Go HTTP API</text>

  <!-- External Dependencies -->

  <!-- ClickHouse -->
  <rect x="50" y="210" width="140" height="80" fill="#fff" rx="16" stroke="#e5e7eb" stroke-width="2" filter="url(#drop-shadow)"/>
  <text x="120" y="245" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#f59e0b">ClickHouse DB</text>
  <text x="120" y="265" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#9ca3af">(Results & Config)</text>

  <!-- Target APIs -->
  <rect x="610" y="160" width="150" height="60" fill="#fff" rx="16" stroke="#e5e7eb" stroke-width="2" filter="url(#drop-shadow)"/>
  <text x="685" y="188" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#10b981">External APIs</text>
  <text x="685" y="205" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="500" text-anchor="middle" fill="#9ca3af">(GitHub, HTTPBin)</text>

  <!-- Cloud/Data -->
  <rect x="610" y="240" width="150" height="60" fill="#fff" rx="16" stroke="#e5e7eb" stroke-width="2" filter="url(#drop-shadow)"/>
  <text x="685" y="268" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#8b5cf6">Large Data</text>
  <text x="685" y="285" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="500" text-anchor="middle" fill="#9ca3af">(GB Upload/Download)</text>

  <!-- Network Path -->
  <rect x="610" y="320" width="150" height="60" fill="#fff" rx="16" stroke="#e5e7eb" stroke-width="2" filter="url(#drop-shadow)"/>
  <text x="685" y="348" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#6366f1">Network Path</text>
  <text x="685" y="365" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="500" text-anchor="middle" fill="#9ca3af">(DNS / Traceroute)</text>


  <!-- Connecting Lines -->

  <!-- DB to Runner (Poll) -->
  <path d="M 190 250 L 290 220" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="240" y="225" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="600" fill="#6b7280" transform="rotate(-15, 240, 225)">Polls Tasks</text>

  <!-- Runner to DB (Insert) -->
  <path d="M 290 240 L 190 270" fill="none" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="240" y="275" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="600" fill="#f43f5e" transform="rotate(-15, 240, 275)">Writes Metrics</text>

  <!-- Runner to Targets -->
  <path d="M 510 205 L 610 190" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow-dark)"/>
  <path d="M 510 220 L 610 270" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow-dark)"/>
  <path d="M 510 235 L 610 350" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow-dark)"/>
  <text x="560" y="190" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="700" fill="#222">Executes Traffic Tests</text>

  <!-- UI to API to DB -->
  <path d="M 400 315 L 400 335" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 290 355 L 120 355 L 120 290" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="140" y="345" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="600" fill="#6b7280">Fetches Results & Configures</text>

  <!-- User Icon -->
  <circle cx="400" cy="450" r="16" fill="#222"/>
  <circle cx="400" cy="445" r="6" fill="#fff"/>
  <path d="M 392 458 Q 400 450 408 458" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text x="400" y="485" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#222">User (Dashboard)</text>
  <path d="M 400 430 L 400 315" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow-dark)"/>

  <!-- Definitions -->
  <defs>
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.05"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
  </defs>
</svg>
