<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#fff" rx="16"/>

  <!-- Title -->
  <text x="400" y="50" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="24" font-weight="800" text-anchor="middle" fill="#222">Task Execution Lifecycle</text>

  <!-- Timeline Base -->
  <line x1="100" y1="200" x2="700" y2="200" stroke="#e5e7eb" stroke-width="4" stroke-linecap="round"/>

  <!-- Tick 1: Scheduling -->
  <circle cx="150" cy="200" r="12" fill="#3b82f6"/>
  <text x="150" y="160" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">Task Scheduled</text>
  <text x="150" y="178" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#64748b">UI / API -> ClickHouse</text>

  <!-- Tick 2: Runner Picks Up -->
  <circle cx="300" cy="200" r="12" fill="#f59e0b"/>
  <text x="300" y="240" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">Runner Polls</text>
  <text x="300" y="258" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#64748b">Spawns Context Goroutine</text>

  <!-- Tick 3: Execution -->
  <circle cx="450" cy="200" r="12" fill="#f43f5e"/>
  <text x="450" y="160" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">Traffic Generated</text>
  <text x="450" y="178" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#64748b">HTTP, DNS, GB Payload</text>

  <!-- Activity Waves -->
  <path d="M 450 200 Q 470 140 490 200 T 530 200 T 570 200" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>

  <!-- Tick 4: Record -->
  <circle cx="650" cy="200" r="12" fill="#10b981"/>
  <text x="650" y="240" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">Metrics Written</text>
  <text x="650" y="258" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#64748b">Timeseries Insert -> Dashboard</text>

  <!-- Loop Arrow -->
  <path d="M 650 180 C 650 80, 450 80, 450 180" fill="none" stroke="#e5e7eb" stroke-width="3" stroke-dasharray="8,8" marker-end="url(#arrow-loop)"/>
  <text x="550" y="120" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#9ca3af">Repeats per Interval</text>

  <defs>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e5e7eb"/>
    </marker>
  </defs>
</svg>
